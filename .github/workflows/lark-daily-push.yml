name: GitHub 今日好玩飞书推送

on:
  schedule:
    # UTC 02:00 = Asia/Shanghai 10:00
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "edition 日期（YYYY-MM-DD，留空为上海当天）"
        required: false
        type: string
      dry_run:
        description: "只生成卡片，不发送"
        required: false
        default: false
        type: boolean

concurrency:
  group: lark-daily-push-${{ github.event.inputs.date || github.run_id }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 推送当天卡片
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_RECIPIENT_ID: ${{ secrets.LARK_RECIPIENT_ID }}
          LARK_RECIPIENT_ID_TYPE: open_id
          GITHUB_TODAY_WEBSITE_URL: https://1384e82de8f4.ida-app.bytedance.net
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args=()
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          pnpm bot:send -- "${args[@]}"
